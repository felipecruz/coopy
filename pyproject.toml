[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coopy"
dynamic = ["version"]
description = "coopy - plain objects persistence/prevalence tool"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Felipe Cruz", email = "felipecruz@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "hypothesis>=6.100,<7", "mypy>=1.14,<2"]
dev = ["ruff==0.14.0", "pre-commit>=4,<5"]
docs = ["sphinx>=7,<9"]
zstd = ["zstandard>=0.22"]
lz4 = ["lz4>=4.3"]

[project.urls]
Homepage = "https://github.com/felipecruz/coopy"
Documentation = "http://coopy.readthedocs.org"

[tool.setuptools.dynamic]
version = { attr = "coopy.__version__" }

[tool.setuptools.packages.find]
include = ["coopy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["coopy"]

[tool.coverage.report]
# Full package, including legacy networking and platform-specific snapshot code.
# Measured baseline and reproduction command: docs/development.rst.
fail_under = 93
precision = 2
show_missing = true

[tool.setuptools.package-data]
coopy = ["py.typed"]

[tool.mypy]
python_version = "3.10"
files = ["coopy/base.py", "coopy/asyncio.py", "coopy/convert.py", "coopy/prune.py", "coopy/cli.py", "coopy/decorators.py", "coopy/error.py", "coopy/integrity.py", "coopy/serialization.py", "coopy/foundation.py", "coopy/environment.py", "coopy/testing.py"]
follow_imports = "silent"
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["coopy.decorators", "coopy.environment", "coopy.error", "coopy.integrity", "coopy.serialization", "coopy.testing"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["coopy.base", "coopy.asyncio", "coopy.convert", "coopy.prune", "coopy.cli"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "coopy.foundation"
disallow_untyped_defs = true
