name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pre_commit validate-config

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install "setuptools>=77" wheel -e ".[test,zstd,lz4]"
      - name: Type check public API
        run: |
          python -m mypy
          python scripts/check_typing.py
      - name: Run tests including Hypothesis properties and coverage gate
        run: python -m pytest --verbose -W error::DeprecationWarning --cov=coopy --cov-report=term-missing --cov-report=xml
        timeout-minutes: 5
      - name: Upload coverage to Codecov
        # Upload even when the coverage gate fails, so the drop is visible.
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          flags: py${{ matrix.python-version }}-${{ runner.os }}
          name: Python ${{ matrix.python-version }} (${{ matrix.os }})
          # Fork and Dependabot PRs have no access to the token; don't fail them.
          fail_ci_if_error: ${{ github.event_name == 'push' }}

  free-threaded:
    name: Free-threaded (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.13t is left out: Hypothesis ships a PyO3 extension, and PyO3 does
        # not support free-threaded builds before 3.14.
        python-version: ["3.14t"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core test dependencies
        run: python -m pip install "setuptools>=77" wheel pytest "hypothesis>=6.100,<7" -e .
      - name: Verify free-threading and run suite including concurrent readers/writers
        # Set PYTHON_GIL only here: setup-python on macOS runs the regular
        # (GIL) build during install, which aborts if PYTHON_GIL=0.
        env:
          PYTHON_GIL: "0"
          COOPY_REQUIRE_NO_GIL: "1"
        run: |
          python -c "import sys, sysconfig; assert sysconfig.get_config_var('Py_GIL_DISABLED') == 1; assert not sys._is_gil_enabled()"
          python -m pytest --verbose -W error::DeprecationWarning
        timeout-minutes: 5

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[docs]"
      - run: python -m sphinx -W --keep-going -E -a -b html docs build/docs

  build:
    name: Build distributions
    needs: [lint, test, free-threaded, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Verify descriptions and installed persistence
        run: python scripts/check_distributions.py
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import coopy; print(coopy.__version__)")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match coopy.__version__ ($version)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/coopy/
    permissions:
      id-token: write  # PyPI trusted publishing (no API token needed)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
